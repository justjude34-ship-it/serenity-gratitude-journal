<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0a0e1a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Serenity — Gratitude Journal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%232dd4bf'/%3E%3Cstop offset='1' stop-color='%23f472b6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M32 46c-1.2-1-12-9.5-12-18a7.5 7.5 0 0 1 12-5.8A7.5 7.5 0 0 1 44 28c0 8.5-10.8 17-12 18z' fill='white' opacity='.95'/%3E%3Cpath d='M38 18c2.5-3 6-2.5 7.5 0 1 1.6.8 3.5-.2 5L38 32l-5-6c2-2.5 3.2-5.2 5-8z' fill='%23a7f3d0' opacity='.9'/%3E%3C/svg%3E"/>
<style>
:root{
  --bg:#070b14;--bg2:#0c1220;--card:rgba(18,26,46,.72);--card-solid:#121a2e;
  --teal:#2dd4bf;--teal-dim:#14b8a6;--pink:#f472b6;--gold:#fbbf24;
  --green:#4ade80;--blue:#60a5fa;--purple:#c084fc;
  --text:#e8eef8;--muted:#8b9bb4;--border:rgba(45,212,191,.18);
  --shadow:0 12px 40px rgba(0,0,0,.45);--radius:18px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;border:none;cursor:pointer;background:none;color:inherit}
textarea,input{font:inherit;color:inherit;background:transparent;border:none;outline:none;resize:none;width:100%}
.app{height:100%;position:relative;overflow:hidden}

/* Cosmic background */
.cosmic{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 50% at 20% 10%,rgba(45,212,191,.18),transparent 55%),
    radial-gradient(ellipse 70% 45% at 85% 20%,rgba(244,114,182,.14),transparent 50%),
    radial-gradient(ellipse 60% 40% at 50% 90%,rgba(251,191,36,.08),transparent 55%),
    radial-gradient(ellipse 100% 80% at 50% 50%,#0a1020,var(--bg));
}
.cosmic::before{
  content:"";position:absolute;inset:0;
  background-image:
    radial-gradient(1.5px 1.5px at 10% 20%,rgba(255,255,255,.5),transparent),
    radial-gradient(1px 1px at 30% 60%,rgba(255,255,255,.35),transparent),
    radial-gradient(1.5px 1.5px at 70% 15%,rgba(255,255,255,.45),transparent),
    radial-gradient(1px 1px at 85% 55%,rgba(255,255,255,.3),transparent),
    radial-gradient(1px 1px at 50% 40%,rgba(255,255,255,.25),transparent),
    radial-gradient(1.5px 1.5px at 20% 80%,rgba(255,255,255,.4),transparent),
    radial-gradient(1px 1px at 60% 75%,rgba(255,255,255,.3),transparent);
  opacity:.7;animation:twinkle 8s ease-in-out infinite alternate;
}
.aurora{
  position:absolute;width:140%;height:60%;left:-20%;top:-10%;
  background:conic-gradient(from 180deg at 50% 50%,
    transparent 0deg,rgba(45,212,191,.12) 60deg,transparent 120deg,
    rgba(244,114,182,.1) 200deg,transparent 260deg,rgba(251,191,36,.08) 320deg,transparent 360deg);
  filter:blur(40px);animation:drift 18s ease-in-out infinite alternate;opacity:.9;
}
@keyframes twinkle{from{opacity:.45}to{opacity:.85}}
@keyframes drift{from{transform:rotate(-8deg) translateY(0)}to{transform:rotate(8deg) translateY(20px)}}

.screen{position:absolute;inset:0;z-index:1;display:none;flex-direction:column;
  padding:max(16px,env(safe-area-inset-top)) 20px max(20px,var(--safe-b));
  overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen.active{display:flex}

/* COVER */
#cover{align-items:center;justify-content:center;text-align:center;gap:0}
.cover-inner{display:flex;flex-direction:column;align-items:center;max-width:380px;width:100%;padding:24px 8px}
.app-icon{
  width:88px;height:88px;border-radius:22px;margin-bottom:28px;
  background:linear-gradient(135deg,#2dd4bf 0%,#5eead4 40%,#f472b6 100%);
  display:grid;place-items:center;
  box-shadow:0 0 40px rgba(45,212,191,.45),0 0 80px rgba(244,114,182,.25),0 16px 32px rgba(0,0,0,.4);
  position:relative;
}
.app-icon svg{width:52px;height:52px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
.label-daily{
  font-size:11px;letter-spacing:.28em;color:var(--teal);font-weight:600;
  text-transform:uppercase;margin-bottom:14px;
}
.title-serenity{
  font-size:clamp(42px,11vw,56px);font-weight:700;line-height:1.05;margin-bottom:6px;
  background:linear-gradient(135deg,#5eead4 0%,#2dd4bf 35%,#f9a8d4 70%,#f472b6 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  letter-spacing:-.02em;
}
.subtitle{font-size:18px;color:var(--muted);font-weight:500;margin-bottom:20px}
.tagline{font-size:14.5px;line-height:1.55;color:var(--muted);max-width:300px;margin-bottom:36px}
.btn-open{
  display:inline-flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,#14b8a6,#2dd4bf);color:#042f2e;
  font-weight:700;font-size:16px;padding:16px 36px;border-radius:999px;
  box-shadow:0 8px 28px rgba(45,212,191,.4);transition:transform .15s,box-shadow .15s;
  min-height:52px;
}
.btn-open:active{transform:scale(.97)}
.btn-open svg{width:20px;height:20px}
.footer-tag{margin-top:40px;font-size:13px;color:rgba(139,155,180,.7);letter-spacing:.04em}

/* HOME */
.home-header{display:flex;align-items:center;gap:12px;margin-bottom:22px;padding-top:4px}
.home-header .mini-icon{
  width:42px;height:42px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,#2dd4bf,#f472b6);
  display:grid;place-items:center;
  box-shadow:0 0 20px rgba(45,212,191,.35);
}
.home-header .mini-icon svg{width:24px;height:24px}
.home-header .titles{display:flex;flex-direction:column;gap:1px}
.home-header .brand{font-size:10px;letter-spacing:.22em;color:var(--teal);font-weight:700}
.home-header .name{font-size:17px;font-weight:650;color:var(--text)}

.stats{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;
}
.stat{
  background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--border);border-radius:16px;padding:14px 14px 12px;
  box-shadow:var(--shadow);
}
.stat-label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:6px}
.stat-label svg{width:14px;height:14px;opacity:.9}
.stat-value{font-size:22px;font-weight:700;line-height:1.1}
.stat-value.pink{color:var(--pink)}

.actions{display:flex;gap:10px;margin-bottom:20px}
.btn-primary,.btn-secondary{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 16px;border-radius:14px;font-weight:650;font-size:15px;min-height:50px;
  transition:transform .12s;
}
.btn-primary:active,.btn-secondary:active{transform:scale(.97)}
.btn-primary{
  background:linear-gradient(135deg,#14b8a6,#2dd4bf);color:#042f2e;
  box-shadow:0 6px 20px rgba(45,212,191,.35);
}
.btn-secondary{
  background:rgba(45,212,191,.1);border:1px solid var(--border);color:var(--teal);
}
.btn-primary svg,.btn-secondary svg{width:18px;height:18px}

.cal-wrap{margin-bottom:8px}
.cal-label{font-size:12px;color:var(--muted);margin-bottom:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.cal-strip{
  display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.cal-strip::-webkit-scrollbar{display:none}
.cal-day{
  flex:0 0 auto;width:56px;height:68px;border-radius:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:var(--card);border:1px solid rgba(255,255,255,.06);
}
.cal-day .dow{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.cal-day .dom{font-size:18px;font-weight:700}
.cal-day.today{
  background:linear-gradient(160deg,#3b82f6 0%,#2563eb 55%,#1d4ed8 100%);
  border-color:transparent;box-shadow:0 6px 20px rgba(37,99,235,.45);
}
.cal-day.today .dow,.cal-day.today .dom{color:#fff}
.cal-day.has-entry:not(.today){border-color:rgba(45,212,191,.45)}
.cal-day.has-entry:not(.today) .dom{color:var(--teal)}
.cal-day .dot{width:5px;height:5px;border-radius:50%;background:var(--teal);margin-top:2px}
.cal-day.today .dot{background:#fff}

.empty-hint{text-align:center;color:var(--muted);font-size:14px;padding:28px 12px;line-height:1.5}

/* WRITE */
.write-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-top:4px}
.write-top h2{font-size:20px;font-weight:700}
.btn-back{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:var(--muted);
}
.btn-back svg{width:20px;height:20px}

.blessings{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.bless-card{
  display:flex;gap:12px;align-items:flex-start;
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:14px;box-shadow:var(--shadow);
}
.bless-num{
  flex-shrink:0;width:28px;height:28px;border-radius:50%;
  background:rgba(45,212,191,.15);border:1.5px solid var(--teal);
  color:var(--teal);font-size:13px;font-weight:700;
  display:grid;place-items:center;margin-top:2px;
}
.bless-card textarea{
  min-height:48px;line-height:1.45;font-size:15px;padding-top:4px;
}
.bless-card textarea::placeholder{color:rgba(139,155,180,.65)}

.btn-add{
  display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
  color:var(--teal);font-size:14px;font-weight:600;padding:8px 4px;margin-bottom:22px;
}
.btn-add svg{width:16px;height:16px}

.section-label{font-size:14px;font-weight:600;color:var(--text);margin-bottom:12px}
.moods{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.mood{
  display:flex;align-items:center;gap:7px;padding:10px 14px;border-radius:999px;
  background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);
  font-size:13px;font-weight:600;color:var(--muted);min-height:42px;
  transition:all .15s;
}
.mood svg{width:16px;height:16px}
.mood.selected{color:#fff;transform:scale(1.03)}
.mood[data-mood="Grateful"].selected{background:rgba(244,114,182,.2);border-color:var(--pink);color:#fbcfe8}
.mood[data-mood="Glad"].selected{background:rgba(251,191,36,.2);border-color:var(--gold);color:#fde68a}
.mood[data-mood="Calm"].selected{background:rgba(74,222,128,.2);border-color:var(--green);color:#bbf7d0}
.mood[data-mood="Tired"].selected{background:rgba(96,165,250,.2);border-color:var(--blue);color:#bfdbfe}
.mood[data-mood="Low"].selected{background:rgba(192,132,252,.2);border-color:var(--purple);color:#e9d5ff}

.reflect-card{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:14px;margin-bottom:20px;box-shadow:var(--shadow);
}
.reflect-card label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
.reflect-card textarea{min-height:72px;font-size:15px;line-height:1.45}
.reflect-card textarea::placeholder{color:rgba(139,155,180,.55)}

.btn-save{
  width:100%;padding:16px;border-radius:16px;font-weight:700;font-size:16px;
  background:linear-gradient(135deg,#14b8a6,#2dd4bf);color:#042f2e;
  box-shadow:0 8px 28px rgba(45,212,191,.4);min-height:54px;margin-bottom:12px;
}
.btn-save:active{transform:scale(.98)}
.btn-save:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* HISTORY */
.history-list{display:flex;flex-direction:column;gap:12px;padding-bottom:20px}
.entry{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:16px;box-shadow:var(--shadow);
}
.entry-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.entry-date{font-size:13px;color:var(--muted);font-weight:500}
.entry-mood{
  font-size:12px;font-weight:650;padding:4px 10px;border-radius:999px;
  background:rgba(255,255,255,.06);
}
.entry-mood.Grateful{color:#fbcfe8;background:rgba(244,114,182,.15)}
.entry-mood.Glad{color:#fde68a;background:rgba(251,191,36,.15)}
.entry-mood.Calm{color:#bbf7d0;background:rgba(74,222,128,.15)}
.entry-mood.Tired{color:#bfdbfe;background:rgba(96,165,250,.15)}
.entry-mood.Low{color:#e9d5ff;background:rgba(192,132,252,.15)}
.entry-blessings{list-style:none;display:flex;flex-direction:column;gap:6px}
.entry-blessings li{
  font-size:14.5px;line-height:1.4;padding-left:18px;position:relative;color:var(--text);
}
.entry-blessings li::before{
  content:"";position:absolute;left:0;top:7px;width:8px;height:8px;border-radius:50%;
  background:var(--teal);opacity:.7;
}
.entry-reflect{margin-top:10px;font-size:13px;color:var(--muted);font-style:italic;line-height:1.4;
  border-top:1px solid rgba(255,255,255,.06);padding-top:10px}

.toast{
  position:fixed;left:50%;bottom:calc(28px + var(--safe-b));transform:translateX(-50%) translateY(120%);
  background:rgba(18,26,46,.95);border:1px solid var(--border);color:var(--text);
  padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:50;
  box-shadow:var(--shadow);transition:transform .3s ease;white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(min-width:480px){
  .screen{max-width:440px;left:50%;transform:translateX(-50%);right:auto;width:100%}
  .stats{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<div class="cosmic"><div class="aurora"></div></div>
<div class="app">

  <!-- COVER -->
  <section id="cover" class="screen active" aria-label="Cover">
    <div class="cover-inner">
      <div class="app-icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M32 50C30.5 48.8 16 38.2 16 27.5a9.5 9.5 0 0 1 15.2-7.5A9.5 9.5 0 0 1 48 27.5C48 38.2 33.5 48.8 32 50z" fill="white" fill-opacity=".96"/>
          <path d="M40 16c3.2-3.8 7.6-3.2 9.4.2 1.2 2.1 1 4.5-.4 6.4L40 34l-6.5-7.8C36 23 37.6 19.5 40 16z" fill="#a7f3d0" fill-opacity=".95"/>
          <path d="M42 20c1.2-1.6 2.8-1.5 3.4.1.4.9.3 1.9-.3 2.7L42 27l-2.4-2.8c.9-1.4 1.5-2.8 2.4-4.2z" fill="white" fill-opacity=".55"/>
        </svg>
      </div>
      <div class="label-daily">Daily Practice</div>
      <h1 class="title-serenity">Serenity</h1>
      <p class="subtitle">Gratitude Journal</p>
      <p class="tagline">A quiet cover for a quiet practice. Open when you are ready to notice what is good.</p>
      <button type="button" class="btn-open" id="btnOpen" aria-label="Open journal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        Open journal
      </button>
      <p class="footer-tag">Pause. Notice. Write it down.</p>
    </div>
  </section>

  <!-- HOME -->
  <section id="home" class="screen" aria-label="Home">
    <header class="home-header">
      <div class="mini-icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none"><path d="M32 50C30.5 48.8 16 38.2 16 27.5a9.5 9.5 0 0 1 15.2-7.5A9.5 9.5 0 0 1 48 27.5C48 38.2 33.5 48.8 32 50z" fill="white"/><path d="M40 16c3.2-3.8 7.6-3.2 9.4.2 1.2 2.1 1 4.5-.4 6.4L40 34l-6.5-7.8C36 23 37.6 19.5 40 16z" fill="#a7f3d0"/></svg>
      </div>
      <div class="titles">
        <span class="brand">SERENITY</span>
        <span class="name">Gratitude Journal</span>
      </div>
    </header>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fb923c" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1.5-3-1 2-2.5 2.5-2.5 4.5a2.5 2.5 0 0 0 1.5 1z"/><path d="M12 2c.5 3 2 5.5 4 7.5 1 1 2 2.5 2 4.5a6 6 0 1 1-12 0c0-2.5 1.5-4.5 3-6 .5 2 2 3 3 4V2z"/></svg>
          Streak
        </div>
        <div class="stat-value" id="statStreak">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          This week
        </div>
        <div class="stat-value" id="statWeek">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          Entries
        </div>
        <div class="stat-value" id="statEntries">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="#f472b6" stroke-width="2"><path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3z"/><path d="M5 16l.8 2.2L8 19l-2.2.8L5 22l-.8-2.2L2 19l2.2-.8L5 16z"/></svg>
          Top mood
        </div>
        <div class="stat-value pink" id="statMood">—</div>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn-primary" id="btnWrite">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        Write
      </button>
      <button type="button" class="btn-secondary" id="btnHistory">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        History
      </button>
    </div>

    <div class="cal-wrap">
      <div class="cal-label">This week</div>
      <div class="cal-strip" id="calStrip"></div>
    </div>
  </section>

  <!-- WRITE -->
  <section id="write" class="screen" aria-label="Write">
    <div class="write-top">
      <button type="button" class="btn-back" id="btnBackWrite" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h2>Today’s blessings</h2>
      <div style="width:40px"></div>
    </div>

    <div class="blessings" id="blessings"></div>
    <button type="button" class="btn-add" id="btnAdd">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
      Add another
    </button>

    <div class="section-label">How are you feeling?</div>
    <div class="moods" id="moods" role="group" aria-label="Mood">
      <button type="button" class="mood" data-mood="Grateful" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="#f472b6"><path d="M12 21s-6.7-4.35-9.33-7.6C.8 11.2 1.1 7.8 3.5 6.1 5.3 4.8 7.7 5.1 9 6.5L12 9.7l3-3.2c1.3-1.4 3.7-1.7 5.5-.4 2.4 1.7 2.7 5.1.83 7.3C18.7 16.65 12 21 12 21z"/></svg>
        Grateful
      </button>
      <button type="button" class="mood" data-mood="Glad" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><circle cx="9" cy="10" r="1" fill="#fbbf24"/><circle cx="15" cy="10" r="1" fill="#fbbf24"/></svg>
        Glad
      </button>
      <button type="button" class="mood" data-mood="Calm" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="#4ade80"><path d="M7 18c4-1 6-5 7-9 2 1 4 3 4 8-3 1-5 2-7 1z"/><path d="M14 5c1.5 2 2 4.5 1.2 7" fill="none" stroke="#86efac" stroke-width="1.5"/></svg>
        Calm
      </button>
      <button type="button" class="mood" data-mood="Tired" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="#60a5fa"><path d="M6 16h12a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.5-1.5A3.5 3.5 0 0 0 6 16z"/></svg>
        Tired
      </button>
      <button type="button" class="mood" data-mood="Low" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="#c084fc"><path d="M18 14.5A6.5 6.5 0 0 1 9.5 6 7.5 7.5 0 1 0 18 14.5z"/></svg>
        Low
      </button>
    </div>

    <div class="reflect-card">
      <label for="reflection">What does this gratitude remind you of? <span style="opacity:.6">(optional)</span></label>
      <textarea id="reflection" placeholder="A quiet thought…" rows="3"></textarea>
    </div>

    <button type="button" class="btn-save" id="btnSave">Save entry</button>
  </section>

  <!-- HISTORY -->
  <section id="history" class="screen" aria-label="History">
    <div class="write-top">
      <button type="button" class="btn-back" id="btnBackHist" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h2>History</h2>
      <div style="width:40px"></div>
    </div>
    <div class="history-list" id="historyList"></div>
  </section>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  const STORAGE_KEY = 'serenity-gratitude-v1';
  const PLACEHOLDERS = [
    'I am grateful for…',
    'Another blessing…',
    'Something small that helped…',
    'A person who made today lighter…',
    'A quiet moment I noticed…',
    'One more gift today…'
  ];

  let entries = load();
  let selectedMood = null;
  let blessCount = 2;

  const $ = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => [...r.querySelectorAll(s)];

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return [];
      const data = JSON.parse(raw);
      return Array.isArray(data) ? data : [];
    }catch(e){ return []; }
  }
  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }

  function show(id){
    $$('.screen').forEach(s => s.classList.remove('active'));
    const el = document.getElementById(id);
    if(el){ el.classList.add('active'); el.scrollTop = 0; }
  }

  function toast(msg){
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function todayKey(d = new Date()){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+day;
  }

  function parseKey(k){
    const [y,m,d] = k.split('-').map(Number);
    return new Date(y, m-1, d);
  }

  function daysWithEntries(){
    const set = new Set(entries.map(e => e.date));
    return set;
  }

  function calcStreak(){
    const set = daysWithEntries();
    if(set.size === 0) return 0;
    let d = new Date();
    // If nothing today, start from yesterday (streak still alive until day ends)
    if(!set.has(todayKey(d))){
      d.setDate(d.getDate()-1);
      if(!set.has(todayKey(d))) return 0;
    }
    let streak = 0;
    while(set.has(todayKey(d))){
      streak++;
      d.setDate(d.getDate()-1);
    }
    return streak;
  }

  function calcWeek(){
    const now = new Date();
    const weekAgo = new Date(now);
    weekAgo.setDate(weekAgo.getDate()-6);
    weekAgo.setHours(0,0,0,0);
    return entries.filter(e => parseKey(e.date) >= weekAgo).length;
  }

  function calcTopMood(){
    if(!entries.length) return '—';
    const counts = {};
    entries.forEach(e => {
      if(e.mood) counts[e.mood] = (counts[e.mood]||0)+1;
    });
    let best = null, n = 0;
    Object.keys(counts).forEach(k => {
      if(counts[k] > n){ n = counts[k]; best = k; }
    });
    return best || '—';
  }

  function renderHome(){
    $('#statStreak').textContent = String(calcStreak());
    $('#statWeek').textContent = String(calcWeek());
    $('#statEntries').textContent = String(entries.length);
    $('#statMood').textContent = calcTopMood();
    renderCalendar();
  }

  function renderCalendar(){
    const strip = $('#calStrip');
    strip.innerHTML = '';
    const set = daysWithEntries();
    const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    for(let i=0;i<7;i++){
      const d = new Date();
      d.setDate(d.getDate()-i);
      const key = todayKey(d);
      const el = document.createElement('div');
      el.className = 'cal-day' + (i===0?' today':'') + (set.has(key)?' has-entry':'');
      const dowLabel = i===0 ? 'TODAY' : dows[d.getDay()].toUpperCase();
      el.innerHTML = '<span class="dow">'+dowLabel+'</span><span class="dom">'+d.getDate()+'</span>' +
        (set.has(key)?'<span class="dot"></span>':'');
      strip.appendChild(el);
    }
  }

  function renderBlessings(){
    const box = $('#blessings');
    const existing = $$('textarea', box).map(t => t.value);
    box.innerHTML = '';
    for(let i=0;i<blessCount;i++){
      const card = document.createElement('div');
      card.className = 'bless-card';
      const ph = PLACEHOLDERS[Math.min(i, PLACEHOLDERS.length-1)];
      card.innerHTML =
        '<div class="bless-num">'+(i+1)+'</div>'+
        '<textarea rows="2" placeholder="'+ph+'" data-i="'+i+'" aria-label="Blessing '+(i+1)+'"></textarea>';
      box.appendChild(card);
      if(existing[i]) $$('textarea', card)[0].value = existing[i];
    }
  }

  function resetWrite(){
    blessCount = 2;
    selectedMood = null;
    $('#reflection').value = '';
    $$('.mood').forEach(m => { m.classList.remove('selected'); m.setAttribute('aria-pressed','false'); });
    renderBlessings();
    updateSaveBtn();
  }

  function updateSaveBtn(){
    const texts = $$('#blessings textarea').map(t => t.value.trim()).filter(Boolean);
    $('#btnSave').disabled = texts.length === 0 || !selectedMood;
  }

  function renderHistory(){
    const list = $('#historyList');
    if(!entries.length){
      list.innerHTML = '<p class="empty-hint">No entries yet.<br>Your first blessing is waiting.</p>';
      return;
    }
    const sorted = entries.slice().sort((a,b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
    list.innerHTML = sorted.map(e => {
      const d = parseKey(e.date);
      const label = d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric', year:'numeric'});
      const blessings = (e.blessings||[]).map(b => '<li>'+escapeHtml(b)+'</li>').join('');
      const reflect = e.reflection ? '<div class="entry-reflect">'+escapeHtml(e.reflection)+'</div>' : '';
      return '<article class="entry">'+
        '<div class="entry-meta"><span class="entry-date">'+label+'</span>'+
        (e.mood?'<span class="entry-mood '+e.mood+'">'+e.mood+'</span>':'')+
        '</div><ul class="entry-blessings">'+blessings+'</ul>'+reflect+'</article>';
    }).join('');
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Events
  $('#btnOpen').addEventListener('click', () => { renderHome(); show('home'); });
  $('#btnWrite').addEventListener('click', () => { resetWrite(); show('write'); });
  $('#btnHistory').addEventListener('click', () => { renderHistory(); show('history'); });
  $('#btnBackWrite').addEventListener('click', () => { renderHome(); show('home'); });
  $('#btnBackHist').addEventListener('click', () => { renderHome(); show('home'); });

  $('#btnAdd').addEventListener('click', () => {
    if(blessCount >= 8){ toast('Eight is a lovely full page'); return; }
    blessCount++;
    renderBlessings();
    updateSaveBtn();
    const areas = $$('#blessings textarea');
    areas[areas.length-1].focus();
  });

  $('#blessings').addEventListener('input', updateSaveBtn);

  $('#moods').addEventListener('click', e => {
    const btn = e.target.closest('.mood');
    if(!btn) return;
    $$('.mood').forEach(m => { m.classList.remove('selected'); m.setAttribute('aria-pressed','false'); });
    btn.classList.add('selected');
    btn.setAttribute('aria-pressed','true');
    selectedMood = btn.dataset.mood;
    updateSaveBtn();
  });

  $('#btnSave').addEventListener('click', () => {
    const blessings = $$('#blessings textarea').map(t => t.value.trim()).filter(Boolean);
    if(!blessings.length || !selectedMood) return;
    const entry = {
      id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      date: todayKey(),
      mood: selectedMood,
      blessings,
      reflection: $('#reflection').value.trim(),
      createdAt: new Date().toISOString()
    };
    entries.push(entry);
    save();
    toast('Saved. Well noticed.');
    renderHome();
    show('home');
  });

  // Boot
  renderBlessings();
  // If returning visitor with entries, skip cover next time? Keep cover always — matches screenshots.
})();
</script>
</body>
</html>
